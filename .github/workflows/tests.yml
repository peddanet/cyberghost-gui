name: quality-gates

# History is linear: branches are rebased and fast-forwarded (see CONTRIBUTING.md).
#   pull_request into main/develop   all gates
#   push of a tag v*                 release-check only
#   workflow_dispatch                manual run of the gates
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  gates:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: system libraries for GTK and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb gir1.2-gtk-4.0 \
            libgirepository-2.0-dev libcairo2-dev pkg-config adwaita-icon-theme
      - name: python tools and package
        run: pip install -r requirements-dev.txt
      - name: quality gates
        run: tools/check.sh

  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: tag matches the package version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/cghostgui/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME"
